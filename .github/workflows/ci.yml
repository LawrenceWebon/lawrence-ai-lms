name: Step 0 foundation

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: ai-lms-ci-${{ github.run_id }}-${{ github.job }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Match container user to runner
        run: |
          echo "AI_LMS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "AI_LMS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build and start pinned tooling containers
        run: docker compose up -d --build --wait
      - name: Lint and architecture boundaries
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Unit and contract tests
        run: make test
      - name: OpenAPI and generated-client drift
        run: make openapi-check
      - name: Web production build
        run: make web-build
      - name: Documentation integrity
        run: make docs-check
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Match container user to runner
        run: |
          echo "AI_LMS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "AI_LMS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build and start pinned tooling containers
        run: docker compose up -d --build --wait
      - name: Verify non-owner production role
        run: make test-rls
      - name: Stop disposable database
        if: always()
        run: docker compose down --volumes

  e2e-f001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Match container user to runner
        run: |
          echo "AI_LMS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "AI_LMS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build and start pinned tooling containers
        run: docker compose up -d --build --wait
      - name: Run the F-001 foundation browser check
        run: make e2e-f001
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes

  e2e-f002:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Match container user to runner
        run: |
          echo "AI_LMS_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "AI_LMS_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build and start pinned tooling containers
        run: docker compose up -d --build --wait
      - name: Run the F-002 course lifecycle browser journey
        run: make e2e-f002
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes
