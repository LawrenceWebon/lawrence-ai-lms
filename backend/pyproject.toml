[project]
name = "ai-lms-backend"
version = "0.0.0"
description = "Minimal Step 0 backend scaffold for the focused AI LMS"
requires-python = "==3.14.*"
dependencies = [
  "Django==6.1",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "PyJWT[crypto]==2.13.0",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.1",
  "pypdf==6.16.2",
]

[dependency-groups]
dev = [
  "django-stubs==6.0.9",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "ruff==0.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lms.config.settings.test"
addopts = "--strict-config --strict-markers"
markers = [
  "rls: requires the disposable PostgreSQL production-role harness",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/models.py" = ["RUF012"]
"**/tests/**/*.py" = ["S101", "S603"]
"../tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["migrations"]
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "lms.config.settings.test"
